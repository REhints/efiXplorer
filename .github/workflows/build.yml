name: build

on:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: build plugin and loader
        run: |
          cmake -S . -B build -DIdaSdk_DIR=third_party/idasdk/src -DHexRaysSdk_ROOT_DIR=third_party/idasdk/src
          cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXplorer.dll
          path: build/plugin/Release/efiXplorer64.dll
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXloader.dll
          path: build/loader/Release/efiXloader64.dll

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: build plugin and loader
        run: |
          cmake -S . -B build -DIdaSdk_DIR=third_party/idasdk/src -DHexRaysSdk_ROOT_DIR=third_party/idasdk/src
          cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXplorer.so
          path: build/plugin/efiXplorer64.so
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXloader.so
          path: build/loader/efiXloader64.so

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: build plugin and loader
        run: |
          cmake -S . -B build -DIdaSdk_DIR=third_party/idasdk/src -DHexRaysSdk_ROOT_DIR=third_party/idasdk/src
          cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXplorer-aarch64.so
          path: build/plugin/efiXplorer64.so
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXloader-aarch64.so
          path: build/loader/efiXloader64.so

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: build plugin and loader
        run: |
          cmake -S . -B build -DIdaSdk_DIR=third_party/idasdk/src -DHexRaysSdk_ROOT_DIR=third_party/idasdk/src
          cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXplorer.dylib
          path: build/plugin/efiXplorer64.dylib
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: efiXloader.dylib
          path: build/loader/efiXloader64.dylib
