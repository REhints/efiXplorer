name: analyse

on:
  push:
    branches: [master]

jobs:
  analyse-all:
    name: analyse plugin and loader
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1
      - name: initialise CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
      - name: autobuild
        run: |
          git submodule update --init --recursive
          cmake -S . -B build -DIdaSdk_DIR=third_party/idasdk/src -DHexRaysSdk_ROOT_DIR=third_party/idasdk/src
          cmake --build build --config Release --parallel
      - name: analyse with CodeQL
        uses: github/codeql-action/analyze@v4.38.3
